<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23db2777'/%3E%3Ctext x='50' y='66' font-family='Arial' font-size='48' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3EJS%3C/text%3E%3C/svg%3E">
<style>

:root {
  --bg: #fdf2f8;
  --surface: #ffffff;
  --surface-2: #fce7f3;
  --ink: #1a0b12;
  --muted: #8b6f7c;
  --line: rgba(236, 72, 153, 0.12);
  --accent: #db2777;
  --accent-light: #f472b6;
  --accent-weak: rgba(219, 39, 119, 0.08);
  --radius: 20px;
  --space: clamp(1rem, 0.8rem + 1vw, 1.5rem);
  --step--1: clamp(0.8rem, 0.78rem + 0.1vw, 0.9rem);
  --step-0: clamp(0.95rem, 0.92rem + 0.2vw, 1.05rem);
  --step-1: clamp(1.15rem, 1.05rem + 0.5vw, 1.5rem);
  --step-2: clamp(1.6rem, 1.3rem + 1vw, 2.2rem);
  --step-3: clamp(2.2rem, 1.6rem + 2vw, 3.5rem);
}

* { box-sizing: border-box; margin: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: "Outfit", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  font-size: var(--step-0);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Typography */
h1, h2, h3, .logo, .nav-links a {
  font-family: "Space Grotesk", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}

h1, h2, h3 {
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-weight: 700;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Layout */
.container {
  width: 90%;
  max-width: 1000px;
  margin: 0 auto;
}

/* Header */
.site-header {
  background: rgba(253, 242, 248, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 0;
}

.logo {
  font-weight: 800;
  font-size: var(--step-1);
  color: var(--ink);
  letter-spacing: -0.04em;
}

.logo span {
  color: var(--accent);
}

.nav-links {
  display: flex;
  gap: 1.8rem;
  list-style: none;
  padding: 0;
}

.nav-links a {
  color: var(--muted);
  font-weight: 600;
  font-size: var(--step--1);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  position: relative;
  padding: 0.3rem 0;
  text-decoration: none;
  transition: color 0.25s;
}

.nav-links a::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -2px;
  width: 0;
  height: 2.5px;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s ease, left 0.3s ease;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--accent);
}

.nav-links a:hover::after,
.nav-links a.active::after {
  width: 100%;
  left: 0;
}

/* Main */
main { flex: 1; }

/* Footer */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 2.5rem 0;
  text-align: center;
  color: var(--muted);
  font-size: var(--step--1);
  margin-top: auto;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 2rem;
  border-radius: 99px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff;
  font-weight: 700;
  font-size: var(--step--1);
  border: none;
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s;
  box-shadow: 0 4px 16px -4px rgba(219, 39, 119, 0.35);
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px -6px rgba(219, 39, 119, 0.45);
  text-decoration: none;
}

.btn-ghost {
  background: transparent;
  border: 2px solid var(--line);
  color: var(--accent);
  box-shadow: none;
}

.btn-ghost:hover {
  background: var(--accent-weak);
  box-shadow: 0 4px 16px -4px rgba(219, 39, 119, 0.2);
}

/* Pink gradient background for sections */
.bg-pink-gradient {
  background:
    radial-gradient(ellipse at 20% 0%, rgba(244, 114, 182, 0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(219, 39, 119, 0.06) 0%, transparent 50%),
    linear-gradient(180deg, #fdf2f8 0%, #fce7f3 100%);
  position: relative;
}

.bg-pink-gradient::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(219, 39, 119, 0.04) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  z-index: 0;
}

.bg-pink-gradient > * {
  position: relative;
  z-index: 1;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .btn:hover { transform: none; }
  .nav-links a::after { transition: none; }
}

/* Mobile nav */
@media (max-width: 600px) {
  .nav-wrap { flex-direction: column; gap: 0.9rem; }
  .nav-links { gap: 1.2rem; }
}


.coming-soon {
  text-align: center;
  padding: clamp(6rem, 15vw, 12rem) 1rem;
}

.coming-soon .icon {
  font-size: 4rem;
  margin-bottom: 1.5rem;
}

.coming-soon h1 {
  font-size: var(--step-2);
  margin-bottom: 1rem;
}

.coming-soon p {
  color: var(--muted);
  max-width: 48ch;
  margin: 0 auto 2rem;
}

.work-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
  max-width: 640px;
  margin: 2rem auto 0;
}

.work-preview .cat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.25rem;
  text-align: center;
  opacity: 0.45;
  transition: opacity 0.25s, transform 0.25s;
}

.work-preview .cat:hover {
  opacity: 0.8;
  transform: translateY(-4px);
}

.work-preview .cat .cat-label {
  font-size: var(--step--1);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.25rem;
}

.work-preview .cat .cat-name {
  font-weight: 700;
  font-size: var(--step-1);
}

@media (max-width: 600px) {
  .work-preview { grid-template-columns: 1fr; }
}

</style>
</head>

<section class="coming-soon bg-pink-gradient">

  <p>This section will detail my academic journey from elementary school through college, including my STEM strand in senior high school and my current Computer Science degree.</p>
  <a href="janessa-index.html" class="btn btn-ghost">Back to Home</a>
</section>

</main>
